name: Review Docs After Merge to Main

on:
  push:
    branches:
      - main
      - CU-86d3fdqfw_MCP-Update-the-SKILL-and-MCP-with-improvements-Artems-commenbts_Maksym-Sugonyaka  # remove before merge
  workflow_dispatch:

jobs:
  docs-review:
    name: Check if MCP docs page needs updating
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run documentation review agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DOCS_GITHUB_TOKEN: ${{ secrets.DOCS_GITHUB_TOKEN }}
          GIT_SHA_BEFORE: ${{ github.event.before }}
          GIT_SHA_AFTER: ${{ github.sha }}
        run: python .github/scripts/docs_review_agent.py

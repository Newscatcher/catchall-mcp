name: PR Integration Tests

on:
  pull_request:
    branches:
      - main

jobs:
  integration-tests:
    name: Run integration tests against PR code
    runs-on: ubuntu-latest

    env:
      ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install allurectl
        run: |
          curl -L -o /usr/local/bin/allurectl \
            https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64
          chmod +x /usr/local/bin/allurectl

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest-cov allure-pytest

      - name: Start MCP server
        env:
          CATCHALL_API_KEY: ${{ secrets.CATCHALL_API_KEY }}
        run: |
          python server.py &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 20); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server... ($i/20)"
            sleep 1
          done

      - name: Run integration tests
        env:
          MCP_SERVER_URL: http://localhost:8000/mcp
          CATCHALL_API_KEY: ${{ secrets.CATCHALL_API_KEY }}
        run: |
          set +e
          pytest tests/integration/ -v -s \
            --alluredir=allure-results \
            --cov=. --cov-report=html:coverage-html --cov-report=term
          PYTEST_EXIT=$?
          set -e

          COV=$(coverage report 2>/dev/null | tail -1 | grep -oE '[0-9]+%' | tail -1)
          CU_ID=$(echo "${{ github.head_ref }}" | grep -oE 'CU-[a-z0-9]+' | head -1 | sed 's/CU-//')

          {
            echo "Source.Branch=${{ github.head_ref }}"
            echo "Target.Branch=${{ github.base_ref }}"
            echo "Pipeline.URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Pull.Request.URL=${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
            echo "Code.Coverage=${COV}"
            if [ -n "${CU_ID}" ]; then
              echo "ClickUp.Task=https://app.clickup.com/t/${CU_ID}"
            fi
          } > allure-results/environment.properties

          if [ -d coverage-html ]; then
            tar -czf allure-results/coverage-report.tar.gz -C coverage-html . || echo "coverage archive skipped"
          fi

          allurectl upload allure-results \
            --launch-name "CATCHALL-MCP PR-${{ github.event.pull_request.number }} ${{ github.head_ref }} into ${{ github.base_ref }}"

          exit $PYTEST_EXIT

      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi
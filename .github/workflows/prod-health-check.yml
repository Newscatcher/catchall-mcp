name: Prod Health Check

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  prod-health-check:
    name: Test live production MCP server
    runs-on: ubuntu-latest

    env:
      ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install allurectl
        run: |
          curl -L -o /usr/local/bin/allurectl \
            https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64
          chmod +x /usr/local/bin/allurectl

      - name: Install test dependencies
        run: |
          pip install -r requirements-test.txt
          pip install pytest-cov allure-pytest

      - name: Run integration tests against prod
        env:
          MCP_SERVER_URL: https://catchall-mcp.newscatcherapi.com/mcp
          CATCHALL_API_KEY: ${{ secrets.CATCHALL_API_KEY }}
        run: |
          set +e
          pytest tests/integration/ -v -s \
            --alluredir=allure-results \
            --cov=. --cov-report=html:coverage-html --cov-report=term
          PYTEST_EXIT=$?
          set -e

          COV=$(coverage report 2>/dev/null | tail -1 | grep -oE '[0-9]+%' | tail -1)

          {
            echo "Environment=production"
            echo "Pipeline.URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Code.Coverage=${COV}"
          } > allure-results/environment.properties

          if [ -d coverage-html ]; then
            tar -czf allure-results/coverage-report.tar.gz -C coverage-html . || echo "coverage archive skipped"
          fi

          allurectl upload allure-results \
            --launch-name "CATCHALL-MCP PROD health-check ${{ github.run_id }}"

          exit $PYTEST_EXIT

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": ":red_circle: *Prod MCP Health Check FAILED*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK